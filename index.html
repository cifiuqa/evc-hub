<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVC Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="top-bar">
    <div id="navbar">
      <div class="nav-brand">
        <span class="brand-symbol">◈</span>
        <span class="brand-text">EVC HUB</span>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-tabs">
        <button class="nav-tab active" data-tab="audios">AUDIOS</button>
        <button class="nav-tab"        data-tab="statuses">STATUSES</button>
        <button class="nav-tab"        data-tab="morphs">MORPHS</button>
      </div>
      <!-- Subtab bar: shown for audios tab only -->
      <div id="subtab-bar" class="hidden">
        <div class="subtab-divider"></div>
        <button class="subtab active" data-subtab="aethis">AETHIS</button>
        <button class="subtab"        data-subtab="music">MUSIC</button>
        <button class="subtab"        data-subtab="effects">EFFECTS</button>
        <button class="subtab"        data-subtab="announcements">ANNOUNCEMENTS</button>
      </div>
      <!-- Search bar -->
      <div id="search-bar">
        <div class="search-wrapper">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" class="search-input" placeholder="Search…" autocomplete="off">
          <button class="search-clear hidden" id="search-clear-btn" title="Clear search">×</button>
        </div>
      </div>
      <!-- Credits tab — pinned to far right -->
      <div class="nav-divider"></div>
      <button class="nav-tab nav-tab-credits" data-tab="credits">CREDITS</button>
    </div>
  </div>

  <div id="content-row">
    <aside id="toc-panel">
      <div class="toc-heading">CATEGORIES</div>
      <nav id="toc-list"></nav>
    </aside>

    <main id="main-content">
      <div id="tab-audios" class="tab-panel">
        <div id="subtab-aethis"        class="subtab-panel"></div>
        <div id="subtab-music"         class="subtab-panel" style="display:none"></div>
        <div id="subtab-effects"       class="subtab-panel" style="display:none"></div>
        <div id="subtab-announcements" class="subtab-panel" style="display:none"></div>
      </div>
      <div id="tab-statuses" class="tab-panel" style="display:none"></div>
      <div id="tab-morphs"   class="tab-panel" style="display:none"></div>
      <div id="tab-credits"  class="tab-panel" style="display:none"></div>
    </main>
  </div>

  <div id="vertical-resize-handle" class="resize-handle-v" title="Drag to resize panels"></div>

  <div id="bottom-panels">

    <div id="cmd-queue-panel" class="bottom-panel">
      <div class="panel-header">
        <span class="panel-title">⌨ COMMAND QUEUE</span>
        <div class="panel-controls">
          <span id="cmd-count" class="panel-count">empty</span>
          <button class="btn btn-sm" id="cmd-copy-btn">COPY ALL</button>
          <button class="btn btn-sm btn-danger" id="cmd-clear-btn">CLEAR</button>
        </div>
      </div>
      <div class="panel-body" id="cmd-queue-body">
        <div id="cmd-queue-list" class="queue-list"></div>
        <div class="cmd-input-row">
          <input type="text" id="cmd-manual-input" class="cmd-input"
                 placeholder="type a raw command and press ADD or Enter…">
          <button class="btn btn-primary btn-sm" id="cmd-add-btn">ADD</button>
        </div>
      </div>
    </div>

    <div id="horizontal-resize-handle" class="resize-handle-h" title="Drag to resize"></div>

    <div id="aethis-queue-panel" class="bottom-panel">
      <div class="panel-header">
        <span class="panel-title">◈ AETHIS QUEUE</span>
        <div class="panel-controls">
          <span id="aethis-count" class="panel-count">empty</span>
          <button class="btn btn-sm" id="aethis-preview-btn" title="Preview all sounds in order">▶ PREVIEW ALL</button>
          <button class="btn btn-sm" id="aethis-to-queue-btn" title="Add full AETHIS sequence to command queue">→ QUEUE</button>
          <button class="btn btn-sm" id="aethis-copy-btn">COPY</button>
          <button class="btn btn-sm btn-danger" id="aethis-clear-btn">CLEAR</button>
        </div>
      </div>
      <div class="panel-body" id="aethis-queue-body">
        <div id="aethis-queue-list" class="queue-list draggable-list"></div>
        <div class="aethis-hint">Drag to reorder · click name to copy ID</div>
      </div>
    </div>

  </div>

  <div id="toast" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
